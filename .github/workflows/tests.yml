name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Linux: the fake TTS engine and ffmpeg cover the whole pipeline. mlx-audio is
    # Apple-Silicon only and is left out by its platform marker; tests that need real
    # models (-m model) or a paid LLM API (-m llm) are opt-in and not run here.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      HUASHUO_REQUIRE_FFMPEG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest --cov --cov-report=term-missing:skip-covered
