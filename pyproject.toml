[project]
name = "huashuo"
dynamic = ["version"]
description = "话说 Huashuo: Chinese-first audiobook generator — novel in, M4B out, synthesized locally on Apple Silicon"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.10",
    "pyloudnorm>=0.1.1",
    "pillow>=10",      # the plain text cover for books without one (M4B-4)
    # Pinned exactly: route C (voice-vector injection) reaches into mlx-audio internals.
    "mlx-audio==0.5.5; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
huashuo = "huashuo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/huashuo/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/huashuo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
