[project]
name = "huashuo"
dynamic = ["version"]
description = "话说 Huashuo: multi-voice audiobooks from Chinese novels, synthesized locally on Apple Silicon"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "wixette" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.10",
    "pyloudnorm>=0.1.1",
    "pillow>=10.1",    # the plain text cover for books without one (M4B-4)
    "opencc>=1.1",     # traditional -> simplified for the ASR check (SYN-10)
    "zhon>=2.0",       # the set of Chinese punctuation marks (TXT-7), MIT
    "pypinyin>=0.50",  # the ASR check compares how text sounds (SYN-10), MIT
    "pydantic-ai-slim[openai]>=2.48,<3",  # LLM stages (requirements §3.9, design doc §6.5)
    # Pinned exactly: route C (voice-vector injection) reaches into mlx-audio internals.
    "mlx-audio==0.5.5; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
huashuo = "huashuo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/huashuo/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/huashuo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# No test calls a paid API or the network (conftest.py enforces it); LLM code is tested
# with mock models. Tests that load real local model weights are opt-in: `pytest -m model`.
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not model"]
markers = [
    "ffmpeg: needs ffmpeg/ffprobe (skipped locally without it, fails in CI)",
    "model: needs real Qwen3-TTS/ASR weights already downloaded (Apple Silicon, offline)",
]
xfail_strict = true
filterwarnings = ["error::ResourceWarning"]

[tool.coverage.run]
branch = true
source = ["huashuo"]
